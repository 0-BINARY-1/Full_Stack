<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Analyzer</title>
  <link rel="stylesheet" href="textstyle.css">
</head>
<body>
  <div class="container">
    <h1>JavaScript Text Analyzer</h1>
    <p>Enter a sentence below:</p>

    <textarea id="textInput"
      placeholder="Type your sentence here..."></textarea>

    <button onclick="analyzeText()">Analyze Text</button>

    <div id="result"></div>
  </div>

  <script src="textstyle.js"></script>
</body>
</html>
