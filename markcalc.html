<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Calculator</title>
  <link rel="stylesheet" href="markcalcstyle.css">
</head>
<body>
  <div class="container">
    <h1>Student Marks Calculator</h1>

    <label>English (out of 100):</label>
    <input type="number" id="english" min="0" max="100" value="80">

    <label>Mathematics (out of 100):</label>
    <input type="number" id="math" min="0" max="100" value="90">

    <label>Science (out of 100):</label>
    <input type="number" id="science" min="0" max="100" value="75">

    <label>Nepali (out of 100):</label>
    <input type="number" id="nepali" min="0" max="100" value="85">

    <label>Computer (out of 100):</label>
    <input type="number" id="computer" min="0" max="100" value="95">

    <button onclick="calculateMarks()">Calculate Result</button>
    <div id="result" aria-live="polite"></div>
  </div>

  <script src="markcalcscript.js"></script>
</body>
</html>
