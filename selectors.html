<!DOCTYPE html>
<html>
    <head>
        <meta charset ="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Selectors</title>
        <style>
            /* Universal Selector (*) */
            *
            {
                margin: 0;
                padding: 0;

            }
            /* Element Selector */
            p
            {
                justify-content: center;
                align-items: center;
                display: flex;
                min-height: 10vh;
                color: blue;
                font-size: 20px;
                background-color: #f2f2f2;
                padding: 10px;
                width: 500px;
                
            }
            /* Class Selector */
            .Heading1
            {
                text-align: center;
                color: rgb(0, 0, 39)
            }
            /* ID Selector */
            #Home
            {
                border: 2px solid black;
                background-color: rgba(135, 233, 236, 0.726)
            }


        </style>
    </head>
    <body>
        <h1 class="Heading1">Universal Selector (*)</h1>
        <p>The content is styled using the universal selector (*).</p>
        <p id="Home">Go to the home page</p>

    </body>
</html>
