
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Analyzer</title>
    <link rel="stylesheet" href="bustyle.css">
</head>
<body>
    <div class="container">
        <h1>Student Marks Analyzer</h1>

        <button onclick="showAllStudents()">Show All Students</button>
        <button onclick="showPassedStudents()">Show Passed Students</button>
        <button onclick="showAverage()">Calculate Average</button>

        <div class="search-box">
            <input type="text" id="studentName"
                   placeholder="Enter student name">
            <button onclick="findStudent()">Find Student</button>
        </div>

        <div id="result">
            Click a button to analyze student records.
        </div>
    </div>

    <script src="bucode.js"></script>
</body>
</html>
