<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Profile</title>
  <link rel="stylesheet" href="DOMstyle.css">
</head>
<body>
  <div class="container">
    <h1 id="heading">My Personal Profile</h1>

    <div id="profile">
      <h2 id="name">Hello! I am a Web Development Student</h2>
      <p id="description">
        I am learning HTML, CSS, and JavaScript.
      </p>
    </div>

    <div class="buttons">
      <button id="changeText">Change Text</button>
      <button id="changeStyle">Change Style</button>
      <button id="toggleProfile">Hide Profile</button>
    </div>
  </div>

  <script src="DOMscript.js"></script>
</body>
</html>
