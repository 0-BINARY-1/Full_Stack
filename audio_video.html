 <!DOCTYPE html>
 <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Media Elements</title>
    </head>
    <body>
        <h1 align="center">HTML Media Elements</h1>
        <h2>Audio</h2>
        <audio controls>
            <source src="https://www.youtube.com/watch?v=BYkdTQfK6Yw&list=RDBYkdTQfK6Yw&start_radio=1" type="audio/mpeg">
        </audio>
        <h2>Video</h2>
        <video width="320" height="240" controls>
            <source src="https://www.youtube.com/watch?v=BYkdTQfK6Yw&list=RDBYkdTQfK6Yw&start_radio=1" type="video/mp4">
        </video>
        <br>
        <h2>Embedded YouTube Video</h2>
        <iframe>
            width="560"
            height="315"
            src="https://www.youtube.com/embed/BYkdTQfK6Yw"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
        </iframe>
    </body>
 </html>
