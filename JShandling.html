<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="eventhstyle.css">
</head>
<body>
  <div class="container">
    <h1>Student Registration</h1>

    <form id="registrationForm">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" required minlength="2" maxlength="60">
      <p id="namePreview">Your name will appear here.</p>

      <label for="email">Email Address</label>
      <input type="email" id="email" required>

      <label for="course">Choose Course</label>
      <select id="course" required>
        <option value="">Select a course</option>
        <option value="HTML and CSS">HTML and CSS</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Full-Stack Development">Full-Stack Development</option>
      </select>

      <button type="submit">Register</button>
    </form>

    <p id="result" aria-live="polite"></p>
  </div>

  <script src="eventhscript.js"></script>
</body>
</html>
