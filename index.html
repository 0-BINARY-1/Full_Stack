<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="istyle.css" />
</head>
<body>
  <main class="page">

    <!-- Hero -->
    <section class="card hero">
      <p class="eyebrow">Student Management</p>
      <h1>Manage student records and information</h1>
      <p class="subtitle">Keep enrollment, parent links, emergency details, and status tidy in one place.</p>

      <div class="actions">
        <div class="dropdown" id="exportDropdown">
          <button class="btn btn-pill" id="exportBtn" aria-haspopup="true" aria-expanded="false">
            Export as <i class="fa-solid fa-chevron-down"></i>
          </button>
          <ul class="dropdown-menu" id="exportMenu" hidden>
            <li><button data-export="csv">CSV</button></li>
            <li><button data-export="json">JSON</button></li>
          </ul>
        </div>

        <button class="btn btn-pill" id="bulkUploadBtn">Bulk Upload</button>
        <input type="file" id="bulkUploadInput" accept=".csv" hidden />

        <button class="btn btn-pill" id="bulkEnrollBtn">
          <i class="fa-solid fa-users"></i> Bulk Enroll
        </button>
        <button class="btn btn-pill" id="promoteBtn">
          <i class="fa-solid fa-arrow-up"></i> Promote Students
        </button>
        <button class="btn btn-primary" id="addStudentBtn">
          <i class="fa-solid fa-plus"></i> Add Student
        </button>
      </div>
    </section>

    <!-- Stats -->
    <section class="stats" id="stats" aria-live="polite">
      <article class="card stat"><div class="skeleton"></div></article>
      <article class="card stat"><div class="skeleton"></div></article>
      <article class="card stat"><div class="skeleton"></div></article>
      <article class="card stat"><div class="skeleton"></div></article>
    </section>

    <!-- Table card -->
    <section class="card table-card">
      <h2>All Students</h2>
      <p class="muted" id="resultCount">Loading students…</p>

      <div class="toolbar">
        <div class="toolbar-left">
          <button class="btn btn-pill btn-sm" id="filtersBtn"><i class="fa-solid fa-filter"></i> Filters</button>
          <div class="dropdown">
            <button class="btn btn-pill btn-sm" id="presetsBtn"><i class="fa-solid fa-bookmark"></i> Presets</button>
            <ul class="dropdown-menu" id="presetsMenu" hidden></ul>
          </div>
          <div class="dropdown">
            <button class="btn btn-pill btn-sm" id="columnsBtn"><i class="fa-regular fa-table-columns"></i> Columns</button>
            <ul class="dropdown-menu" id="columnsMenu" hidden></ul>
          </div>
          <button class="btn btn-pill btn-sm" id="printBtn"><i class="fa-solid fa-print"></i> Print</button>

          <label class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="searchInput" placeholder="Search by name, admission no…" />
          </label>
        </div>

        <div class="toolbar-right">
          <select id="classSelect" class="select" aria-label="Select class">
            <option value="">Select Class</option>
          </select>
          <select id="statusSelect" class="select" aria-label="Select status">
            <option value="">Select Status</option>
            <option value="Active">Active</option>
            <option value="Pending">Pending</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="filters-panel" id="filtersPanel" hidden>
        <label>Gender
          <select id="genderSelect" class="select">
            <option value="">All</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </label>
        <button class="btn btn-pill btn-sm" id="clearFiltersBtn">Clear all</button>
        <button class="btn btn-pill btn-sm" id="savePresetBtn">Save as preset</button>
      </div>

      <div class="table-wrap">
        <table id="studentTable">
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="selectAll" aria-label="Select all" /></th>
              <th data-col="student" data-sort="name">Student <i class="sort fa-solid fa-sort"></i></th>
              <th data-col="status" data-sort="status">Status <i class="sort fa-solid fa-sort"></i></th>
              <th data-col="gender" data-sort="gender">Gender <i class="sort fa-solid fa-sort"></i></th>
              <th data-col="class" data-sort="className">Class <i class="sort fa-solid fa-sort"></i></th>
              <th data-col="parent">Parent</th>
              <th data-col="created" data-sort="createdAt">Date Created <i class="sort fa-solid fa-sort"></i></th>
              <th data-col="actions">Actions</th>
            </tr>
          </thead>
          <tbody id="studentBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
